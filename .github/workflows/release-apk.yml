name: Build APK on Release

# Tiap Release di-publish di GitHub (tag vX.Y.Z) → build APK & tempel ke Release itu.
# Versi app diturunkan otomatis dari tag: versionName = X.Y.Z, versionCode = X*10000 + Y*100 + Z.
on:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Derive version from tag
        id: version
        run: |
          tag="${GITHUB_REF_NAME}"
          if [[ "$tag" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            major="${BASH_REMATCH[1]}"
            minor="${BASH_REMATCH[2]}"
            patch="${BASH_REMATCH[3]}"
          else
            # Manual run dari tab Actions tidak punya tag Release.
            major=1
            minor=0
            patch="${GITHUB_RUN_NUMBER}"
          fi
          name="${major}.${minor}.${patch}"
          code=$(( major * 10000 + minor * 100 + patch ))
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "APK: shakala-pos-$name.apk (versionCode=$code, versionName=$name)"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22 # Capacitor 8 CLI butuh Node >= 22
          cache: npm

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21 # Capacitor 8 module capacitor-android di-compile source release 21

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses > /dev/null || true

      - name: Install Android platform & build-tools
        run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Install dependencies
        run: npm ci

      - name: Build web
        env:
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL }}
          VITE_GOOGLE_CLIENT_ID: ${{ secrets.VITE_GOOGLE_CLIENT_ID }}
        run: npm run build

      - name: Capacitor sync
        run: npx cap sync android

      - name: Build APK (debug-signed)
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug \
            -PappVersionCode=${{ steps.version.outputs.code }} \
            -PappVersionName=${{ steps.version.outputs.name }}

      - name: Rename APK
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/debug/app-debug.apk \
            "dist/shakala-pos-${{ steps.version.outputs.name }}.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: shakala-pos-${{ steps.version.outputs.name }}
          path: dist/shakala-pos-${{ steps.version.outputs.name }}.apk

      - name: Attach APK to Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: dist/shakala-pos-${{ steps.version.outputs.name }}.apk
